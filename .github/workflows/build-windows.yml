name: Build Windows EXE

on:
  push:
    tags:
      - "v*"          # trigger on version tags like v1.0, v1.2.3
  workflow_dispatch:  # also allow manual trigger from GitHub UI

# This workflow runs ONLY on GitHub-hosted runners.
# Public repos = unlimited free minutes. Zero cost, ever.
permissions:
  contents: write   # needed to upload files to GitHub Releases

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true   # cancel duplicate runs to save minutes

jobs:
  build:
    runs-on: windows-latest   # free on public repos, no charge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Build ODF with PyInstaller
        # All build settings live in packaging/odf.spec (shared with build_exe.py)
        run: pyinstaller --noconfirm --clean packaging/odf.spec

      - name: Verify build output
        run: |
          if (Test-Path "dist\ODF\ODF.exe") {
            $size = (Get-ChildItem -Recurse "dist\ODF" | Measure-Object -Property Length -Sum).Sum / 1MB
            Write-Host "BUILD SUCCESSFUL — dist\ODF\ ($([math]::Round($size, 1)) MB total)"
          } else {
            Write-Error "BUILD FAILED — dist\ODF\ODF.exe not found"
            exit 1
          }

      - name: Smoke test - EXE starts without crashing
        # Catches crashes at import/startup in the frozen build (no console, so
        # they are otherwise silent). Fatal errors are logged before the error
        # dialog blocks, so a hung-but-crashed app still fails this check.
        run: |
          $p = Start-Process -FilePath "dist\ODF\ODF.exe" -PassThru
          Start-Sleep -Seconds 30
          $log = Join-Path $env:APPDATA "ODF\odf.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.HasExited) {
            Write-Error "ODF.exe exited early (exit code $($p.ExitCode))"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path $log) -or -not (Select-String -Path $log -Pattern "ODF starting" -Quiet)) {
            Write-Error "odf.log was not written - logging setup failed"
            exit 1
          }
          if (Select-String -Path $log -Pattern "Fatal error|Backend init failed" -Quiet) {
            Write-Error "Startup error found in odf.log"
            exit 1
          }

      - name: Zip ODF folder for distribution
        run: Compress-Archive -Path dist\ODF\* -DestinationPath dist\ODF-Windows.zip

      - name: Upload ODF-Windows.zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ODF-Windows
          path: dist/ODF-Windows.zip
          retention-days: 30

      - name: Upload ODF-Windows.zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ODF-Windows.zip
