[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "odf"
description = "Offline Document Finder: local, AI-powered semantic search for your documents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"  # pinned numpy 1.26 has no wheels for 3.13+
dynamic = ["version", "dependencies"]

[project.scripts]
odf = "odf.app:main"

[tool.setuptools.dynamic]
version = { attr = "odf.__version__" }
# Exact pins live in requirements.txt (see the note there about chromadb)
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
xfail_strict = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["odf", "tests"]
